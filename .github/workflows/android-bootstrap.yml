name: Android bootstrap

on:
  push:
    branches:
      - feature/android-port-oneui8
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-bootstrap.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Ardour Android
        uses: actions/checkout@v4

      - name: Checkout OneUI Compose
        uses: actions/checkout@v4
        with:
          repository: Ragnarok93/oneui-compose
          ref: feature/oneui8-compose-components
          path: android/oneui-compose-src

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build Android debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace -PoneuiComposeDir="$GITHUB_WORKSPACE/android/oneui-compose-src"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ardour-android-bootstrap-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
