name: Android engine cross-build

on:
  pull_request:
    paths:
      - "android/engine/**"
      - "libs/backends/android/**"
      - "libs/ardour/**"
      - "libs/pbd/**"
      - "libs/lua/**"
      - "libs/midi*2/**"
      - "libs/evoral/**"
      - "libs/temporal/**"
      - "libs/audiographer/**"
      - "libs/zita-resampler/**"
      - "libs/zita-convolver/**"
      - "libs/staffpad/**"
      - "libs/fluidsynth/**"
      - "libs/libltc/**"
      - "libs/ptformat/**"
      - "wscript"
      - ".github/workflows/android-engine.yml"

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Ardour Android
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake gettext libtool ninja-build pkg-config

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358"

      - name: Validate setup
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          echo "Android engine host/NDK setup ready"